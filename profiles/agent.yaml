      vision_arc_angle: 210.0
      vision_max_dist: 5.0
      use_bfs_spawn_heading: true
      activate_gps_compass: true
      use_binocular_gps_compasses: true
      range_gps_compass: 1.0
      activate_cardinal_compass: true
      activate_north_compass: true
      activate_exit_compass: true
      exit_compass_los_gating: true
      range_exit_compass: 40.0
      target_compasses_offset_angle: 30.0
      focus_field_of_view: 180.0
      periphere_field_of_view: 360.0
    neural:
      memory_frames: 2
      hidden_layers: 3
      neurons: 40

