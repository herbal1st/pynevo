# ============================================================================
# AGENT LIBRARY CONFIGURATION LEGEND
# ============================================================================
#
# KINEMATICS (Driving Physics & Steering Mechanics):
# profile_style:                Driving steering mode ("TANK" or "CAR").
# use_linear_speed_output:       Toggle: true = Task-Space (FWD/BWD+S-L/S-R),
#                               false = Differential Wheels (Left/Right Tracks).
# move_speed:                   Maximum forward velocity in maze mode.
# endless_move_speed:           Maximum forward velocity in endless mode.
# turn_speed:                   Maximum rotational velocity (deg/sec).
# agent_diameter_ratio:         Hit-box diameter ratio in maze mode.
# endless_agent_diameter_ratio: Hit-box diameter ratio in endless mode.
#
# METABOLICS (Energy & Survival Rates):
# base_dmg_per_frame:           Background existence tax per frame.
# move_fwd_dmg_per_frame:       Forward movement work tax per frame.
# move_bwd_dmg_per_frame:       Backward movement work tax per frame.
# spin_dmg_per_frame:           Rotational turning work tax per frame.
# coll_dmg_per_frame:           Wall impact damage penalty per frame.
# idle_dmg_per_frame:           Stalling penalty rate per frame.
# path_dmg_per_frame:           Energy tax per frame moving off path.
# target_hold_dmg_per_frame:    Energy tax per frame inside target zone.
# move_dmg_threshold:           Speed ratio required for move tax.
# spin_dmg_threshold:           Rotation ratio required for spin tax.
# idle_dmg_threshold:           Speed ratio required before stalling tax.
# heal_speed_threshold:         Speed ratio where behavioral heal clamps.
# target_hold_distance_threshold: Target boundary radius for plateau.
# target_zone_plateau_intensity: Scent intensity inside target zone.
# invert_target_zone_field:     Toggle: true = Target inflicts hazard damage.
# full_heal_on_stage_clear:     Toggle restoring health on stage clear.
# base_heal_per_frame:          Base background recovery rate per frame.
# path_heal_per_frame:          Topological BFS path refuel rate.
# move_fwd_heal_per_frame:      Kinetic forward movement heal rate.
# move_bwd_heal_per_frame:      Kinetic backward movement heal rate.
# spin_heal_per_frame:          Rotational turning heal rate per frame.
# coll_heal_per_frame:          Wall impact recovery rate per frame.
# idle_heal_per_frame:          Stalling recovery rate per frame.
# target_hold_heal_per_frame:   Target zone recovery rate per frame.
#
# PERCEPTION (Sensory Range & Orientation Toggles):
# vision_rays:                  Number of probe rays cast in vision fan.
# vision_arc_angle:             Field of view angle spread in degrees.
# vision_max_dist:              Maximum ray reach distance in tiles.
# use_bfs_spawn_heading:        Toggle BFS aligned or random heading.
# activate_gps_compass:         Toggle for GPS path progress triggers.
# use_binocular_gps_compasses:  Toggle: true = Stereo, false = Mono.
# range_gps_compass:            Ratio threshold [0.0 - 1.0] for GPS.
# activate_cardinal_compass:    Toggle for 4-needle cardinal compass.
# activate_north_compass:       Toggle for North compass (NFL/NFR/etc).
# activate_exit_compass:        Toggle for Exit compass (EFL/EFR/etc).
# exit_compass_los_gating:      Toggle LOS wall gating for exit radar.
# range_exit_compass:           Max effective distance for exit compass.
# target_compasses_offset_angle: Stereo eye offset angle relative to heading.
# focus_field_of_view:          Narrow focus eye FOV angle in degrees.
# periphere_field_of_view:      Wide peripheral eye FOV angle in degrees.
#
# NEURAL (Multi-Layer Perceptron Topology):
# memory_frames:                Stacked observation frame history count.
# hidden_layers:                Number of dense hidden layers in network.
# neurons:                      Number of neurons per hidden layer.
# ============================================================================