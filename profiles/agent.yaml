# ============================================================================
# AGENT LIBRARY CONFIGURATION LEGEND
# ============================================================================
#
# KINEMATICS (Driving Physics & Damage Rates):
# profile_style:              Driving steering mode ("TANK" or "CAR").
# use_linear_speed_output:     Toggle: true = Task-Space, false = Direct Wheels.
# move_speed:                 Maximum forward translation speed (tiles/tick).
# turn_speed:                 Maximum rotational velocity (degrees/sec).
# player_diameter_ratio:      Hit-box diameter scale relative to tile size.
# health_coll_dmg_per_frame:  Health damage deducted per wall impact frame.
# health_spin_dmg_per_frame:  Health damage deducted per physical spin frame.
# idle_damage_speed_threshold: Physical speed ratio threshold for idle damage.
# health_idle_dmg_per_frame:  Health damage deducted per stationary frame.
# heal_speed_threshold:       Physical speed ratio threshold for kinetic heal.
# move_heal_per_frame:        Health restored per frame during high-speed cruise.
# path_heal_per_frame:        Health restored per frame during path progress.
#
# PERCEPTION (Sensory Range & Orientation Toggles):
# vision_rays:                Number of probe rays cast across vision fan.
# vision_arc_angle:           Field of view angle spread in degrees.
# vision_max_dist:            Maximum ray reach distance in tiles.
# use_bfs_spawn_heading:      Toggle between BFS aligned or random Spawn heading.
# activate_gps_compass:       Master toggle for GPS path progress triggers.
# use_binocular_gps_compasses: Toggle: true = Stereo (4ch), false = Mono (2ch).
# range_gps_compass:          Ratio threshold [0.0-1.0] for GPS triggers.
# activate_cardinal_compass:  Toggle for 4-needle compass (C-N,C-E,C-S,C-W).
# activate_north_compass:     Master toggle for North compass (N_L/N_R).
# activate_exit_compass:      Master toggle for Exit compass (TG-L/TG-R).
# exit_compass_los_gating:    Toggle LOS wall blocking for exit radar.
# range_exit_compass:         Max effective distance for exit compass.
# target_compasses_offset_angle: Stereo eye offset angle relative to heading.
# focus_field_of_view:        Narrow focus eye FOV angle in degrees.
# periphere_field_of_view:    Wide peripheral eye FOV angle in degrees.
#
# NEURAL (Multi-Layer Perceptron Topology):
# memory_frames:              Stacked observation frame history count.
# hidden_layers:              Number of dense hidden layers in network.
# neurons:                    Number of artificial neurons per hidden layer.
# ============================================================================