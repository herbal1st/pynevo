# ============================================================================
# MAP PROFILE CONFIGURATION LEGEND
# ============================================================================
#
# map_type:                   Procedural maze strategy ("BRANCHING_WALLS",
#                             "BRANCHING_WALLS_4_ANCHOR", "RANDOM").
# map_width:                  Total horizontal tile grid dimension (tiles).
# map_height:                 Total vertical tile grid dimension (tiles).
# tile_size:                  Rendered pixel size of an individual tile.
# wall_density:               Target density ratio of placeable walls [0-1].
# stem_early_termination_rate: Probability per step a growing wall stem stubs.
# min_straight_start_steps:   Straight steps before a new stem makes 90° turns.
# ============================================================================