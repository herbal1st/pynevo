    status_ring_ratio: 1.0
    solved_arc_segments: 60.0
    solved_arc_color: [40, 160, 240]
    heading_line_length: 1.25
    heading_line_width: 1
    color_heading_line: [255, 40, 20, 220]

  COLOR:
