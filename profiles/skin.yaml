# ============================================================================
# AGENT LIBRARY CONFIGURATION LEGEND
# ============================================================================
#
# color_player:               RGB color tuple for default agent body.
# color_player_vision_arc:    RGBA color tuple for vision arc fan polygon.
# color_player_vision_rays:   RGBA color tuple for individual DDA ray lines.
# color_player_text:          RGB color tuple for ASCII face text string.
# player_face_text_scale:     Scaling ratio for ASCII face text size.
# face_walk:                  ASCII face rendered during normal walking.
# face_wall:                  ASCII face rendered during wall collision.
# face_dead:                  ASCII face rendered when health depletes.
# face_exit:                  ASCII face rendered when exit is solved.
# show_ascii_faces:           Master toggle: true = render ASCII faces.
# show_status_ring:           Master toggle: true = render status ring.
# status_ring_ratio:          Inner status ring inset scale ratio.
# solved_arc_segments:        Arc segment length spread in degrees.
# solved_arc_color:           RGB color tuple for counter-rotating arcs.
# player_heading_line_length: Multiplier scaling directional heading line.
# player_heading_line_width:  Pixel width of directional heading line.
# color_player_heading_line:  RGBA color tuple for directional heading line.
# ============================================================================