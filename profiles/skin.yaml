    face_text_scale: 0.80
    face_walk: "o_o"
    face_wall: ">_<"
    face_dead: "X_X"
    face_exit: "^_^"
    show_ascii_faces: true
    show_status_ring: false
    status_ring_ratio: 1.0
    solved_arc_segments: 60.0
    solved_arc_color: [40, 160, 240]
    heading_line_length: 1.25
    heading_line_width: 1
    color_heading_line: [255, 40, 20, 220]


# ============================================================================
# SKIN LIBRARY CONFIGURATION LEGEND
# ============================================================================
#
# camera_zoom:         Camera zoom scale applied to entity viewport.
# color_body:          RGB color tuple for default avatar body.
# color_text:          RGB color tuple for ASCII face text string.
# color_vision_arc:    RGBA color tuple for vision arc fan polygon.
# color_vision_rays:   RGBA color tuple for individual DDA ray lines.
# face_text_scale:     Scaling ratio for ASCII face text size.
# face_walk:           ASCII face rendered during normal walking.
# face_wall:           ASCII face rendered during wall collision.
# face_dead:           ASCII face rendered when health depletes.
# face_exit:           ASCII face rendered when exit is solved.
# show_ascii_faces:    Master toggle: true = render ASCII faces.
# show_status_ring:    Master toggle: true = render status ring.
# status_ring_ratio:   Inner status ring inset scale ratio.
# solved_arc_segments: Arc segment length spread in degrees.
# solved_arc_color:    RGB color tuple for counter-rotating arcs.
# heading_line_length: Multiplier scaling directional heading line.
# heading_line_width:  Pixel width of directional heading line.
# color_heading_line:  RGBA color tuple for directional heading line.
# ============================================================================