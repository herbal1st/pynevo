    color_body: [240, 180, 50]
    color_vision_arc: [240, 200, 160, 15]
    color_vision_rays: [240, 200, 160, 80]
    color_text: [10, 10, 15]
    face_text_scale: 0.80
    face_walk: "o_o"
    face_wall: ">_<"
    face_dead: "X_X"
    face_exit: "^_^"
    show_ascii_faces: false
    show_status_ring: true
    status_ring_ratio: 1.0
    solved_arc_segments: 60.0
