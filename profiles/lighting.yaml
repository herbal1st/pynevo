profiles:

  TEST:
    day_cycle_duration: 0.0
    start_time_ratio: 0.00
    start_light_angle_deg: 60.0
    terrain_steepness: 80.0
    shadow_intensity: 140
    highlight_intensity: 70
    ambient_keyframes:
      - [0.00, 255, 255, 255]  # day
      - [1.00, 255, 255, 255]  # day

  DEFAULT:
    day_cycle_duration: 10.0
    start_time_ratio: 0.25
    start_light_angle_deg: 300.0
    terrain_steepness: 80.0
    shadow_intensity: 140
    highlight_intensity: 70
    ambient_keyframes:
      - [0.00, 70, 100, 130]   # night
      - [0.20, 80, 110, 150]   # night
      - [0.25, 175, 175, 175]  # day
      - [0.35, 255, 255, 255]  # day
      - [0.65, 255, 255, 255]  # day
      - [0.75, 175, 175, 175]  # day
      - [0.85, 80, 110, 150]   # night
      - [0.90, 75, 105, 140]   # night
      - [1.00, 70, 100, 130]   # night


# ============================================================================
# LIGHTING PROFILE CONFIGURATION LEGEND
# ============================================================================
#
# day_cycle_duration:    Time in seconds for a full 360° light orbit (0.0 = static).
# start_time_ratio:      Starting ambient time ratio on boot [0.0 - 1.0].
# start_light_angle_deg: Initial light orbital angle in degrees (e.g. 135.0).
# terrain_steepness:     Steepness multiplier for terrain slope shading.
# shadow_intensity:      Maximum opacity for mountain shadows [0 - 255].
# highlight_intensity:   Maximum brightness for slope highlights [0 - 255].
# highlight_color:       RGB color tuple for slope highlights [R, G, B].
# ambient_keyframes:     List of [time_ratio, R, G, B, Alpha] keyframe colors.
# ============================================================================