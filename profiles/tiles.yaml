# ============================================================================
# TILE LIBRARY CONFIGURATION LEGEND
# ============================================================================
#
# id:                 Unique integer tile identifier index [0 - 255].
# name:               Human-readable tile name string.
# solid:              Collision toggle: true = blocks movement, false = open.
# indestructible:     Protection toggle: true = immune to destruction.
# speed_multiplier:   Kinematic surface speed ratio modifier (1.0 = normal).
# color:              RGB fill color tuple [R, G, B] (0 - 255).
# border_color:       RGB outline stroke color tuple [R, G, B] (0 - 255).
# border_width_ratio: Normalized border inset ratio relative to tile size [0-1].
# ============================================================================