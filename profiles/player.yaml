# ============================================================================
# PLAYER LIBRARY CONFIGURATION LEGEND
# ============================================================================
#
# skin_profile:     Name key referencing visual skin profile in skin.yaml.
# profile_style:    Steering mechanics selector ("DIRECT_VECTOR", "TANK", "CAR").
# move_speed:       Base translation velocity scale per frame (tiles/tick).
# turn_speed:       Maximum rotational velocity scale (degrees/sec).
# diameter_ratio:   Hit-box diameter scale relative to full tile width.
# min_spawn_speed:  Minimum terrain speed multiplier required for safe spawn.
# ============================================================================