# ============================================================================
# TRAINING PROFILE CONFIGURATION LEGEND
# ============================================================================
#
# min_path_difficulty_ratio:  Min BFS shortest-path distance ratio [0-1].
# max_path_difficulty_ratio:  Max BFS shortest-path distance ratio [0-1].
# learning_generations:       Generations count simulated during pre-training.
# population_size:            AI candidates evaluated per generation.
# max_simulation_steps:       Maximum step ticks allowed per candidate run.
# elitism_ratio:              Top-scoring candidates ratio copied unchanged.
# mutation_rate:              Offspring mutation probability [0.0 - 1.0].
# mutation_scale:             Noise scale factor added during mutation.
# dist_to_time_bonus_ratio:   Weight balancing progress vs time saved [0-1].
# lost_hp_score_impact_ratio: Health loss score penalty factor [0.0 - 1.0].
# ============================================================================